name: Deploy agent to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["agent/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pushes only the agent/ folder as the root of your HF Space repo
      - name: Push agent/ to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}   # e.g. your-username/my-agent
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE" || { echo "HF_TOKEN / HF_SPACE secret missing"; exit 1; }
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git subtree split --prefix agent -b hf-deploy
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
