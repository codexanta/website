name: Keep agent awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}   # e.g. https://personal-agent.onrender.com
        run: |
          test -n "$AGENT_URL" || { echo "AGENT_URL secret missing"; exit 1; }
          curl -fsS --max-time 90 "$AGENT_URL/health"
