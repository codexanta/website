<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Agent</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e8ee; --mut:#8a93a6; --acc:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; }
  .side { width:300px; background:var(--panel); border-right:1px solid var(--line); padding:14px; overflow:auto; }
  .main { flex:1; display:flex; flex-direction:column; }
  .side h3 { margin:6px 0 8px; font-size:14px; color:var(--mut); }
  .card { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; font-size:13px; }
  input, textarea { width:100%; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; font-size:14px; }
  #log { flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:10px; white-space:pre-wrap; line-height:1.5; }
  .user { align-self:flex-end; background:var(--acc); }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .tool { align-self:flex-start; font-size:12px; color:var(--mut); }
  form { display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); }
  form textarea { resize:none; height:50px; }
  @media (max-width:800px){ body{flex-direction:column;} .side{width:100%; max-height:35vh;} }
</style>
</head>
<body>
<aside class="side">
  <h3>SETTINGS</h3>
  <div class="card">
    <label>Agent token (jodi set kora thake)</label>
    <input id="token" type="password" placeholder="AGENT_TOKEN">
  </div>
  <h3>QUICK COMMANDS</h3>
  <div class="card">
    search: latest AI news<br>fetch: https://example.com<br>read: notes.txt<br>shell: ls<br>apk
  </div>
  <h3>UPLOAD FILE</h3>
  <div class="card"><input id="file" type="file"><br><br><button onclick="upload()">Upload</button></div>
  <div id="status" class="card" style="color:var(--mut)">Ready</div>
</aside>
<section class="main">
  <div id="log"></div>
  <form id="f">
    <textarea id="q" placeholder="Ja chao likho... (Bangla / English)"></textarea>
    <button type="submit">Send</button>
  </form>
</section>
<script>
const log = document.getElementById('log');
let history = [];
function add(cls, text){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; }
function headers(){ const t=document.getElementById('token').value.trim(); return {'Content-Type':'application/json', ...(t?{Authorization:'Bearer '+t}:{})}; }
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const q = document.getElementById('q').value.trim(); if(!q) return;
  add('user', q); document.getElementById('q').value='';
  document.getElementById('status').textContent='Thinking...';
  try{
    const r = await fetch('api/chat', {method:'POST', headers:headers(), body: JSON.stringify({message:q, history})});
    if(!r.ok) throw new Error('HTTP '+r.status+' (token thik ache?)');
    const j = await r.json();
    (j.tool_calls||[]).forEach(t=>add('tool','🔧 '+t.name+' '+JSON.stringify(t.args)));
    add('bot', j.reply || '(empty)');
    history.push({role:'user',content:q},{role:'assistant',content:j.reply||''});
    history = history.slice(-20);
    document.getElementById('status').textContent='Ready';
  }catch(err){ add('bot','Error: '+err.message); document.getElementById('status').textContent='Error'; }
});
async function upload(){
  const f = document.getElementById('file').files[0]; if(!f) return;
  const fd = new FormData(); fd.append('file', f);
  const t=document.getElementById('token').value.trim();
  const r = await fetch('api/upload', {method:'POST', headers: t?{Authorization:'Bearer '+t}:{}, body: fd});
  const j = await r.json().catch(()=>({}));
  add('tool', r.ok ? '📁 Uploaded: '+j.saved : 'Upload failed');
}
</script>
</body>
</html>
